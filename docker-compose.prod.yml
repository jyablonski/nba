# Production overlay for docker-compose.yml. Do not start tools / cube / cron.
# IMAGE_PREFIX/IMAGE_TAG select prebuilt registry images; unset means the local
# `nba-*:latest` this box built. Set PUBLIC_URL to move off baseline.jyablonski.dev
# (the Caddyfile hardcodes the same host separately — ACME needs it there).
# Cube is on the local Tilt stack but stays off here (12GB VM). Ask/MCP need CUBE_API_URL; without Cube they fail clearly (no gold SQL fallback). REST over gold still works.
# Usage: DOCKER_TARGET=runtime docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d postgres api frontend caddy
# `ports: !reset []` (not a bare `[]`) is required so Compose drops the base file's published ports.
services:
  postgres:
    ports: !reset []
    mem_limit: 2g
    command:
      - postgres
      - -c
      - shared_buffers=256MB

  migrate:
    image: ${IMAGE_PREFIX:-}nba-migrate:${IMAGE_TAG:-latest}

  api:
    image: ${IMAGE_PREFIX:-}nba-api:${IMAGE_TAG:-latest}
    ports: !reset []
    mem_limit: 512m

  frontend:
    image: ${IMAGE_PREFIX:-}nba-frontend:${IMAGE_TAG:-latest}
    ports: !reset []
    mem_limit: 512m
    build:
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:-https://baseline.jyablonski.dev}
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_URL:-https://baseline.jyablonski.dev}

  # Base compose bind-mounts host code for local `compose run`. Runtime
  # images must stay baked; `!reset` (not a bare `[]`) drops the merge.
  scraper:
    volumes: !reset []

  dbt:
    volumes: !reset []

  ml:
    volumes: !reset []

  mcp:
    volumes: !reset []

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    depends_on:
      - api
      - frontend

volumes:
  caddy_data:
  caddy_config:
