version: 2

models:
  - name: fct_player_contracts
    description: Player-season remaining contract salary with canonical UUID references.
    columns:
      - name: player_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
      - name: team_id
        data_tests:
          - not_null
      - name: match_method
        data_tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set: ["external_id"]
                quote_values: true
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["player_id", "team_id", "season"]
