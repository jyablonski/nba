version: 2

models:
  - name: fct_player_contracts
    description: >
      Player-season remaining contract salary. player_id is null when the
      Basketball-Reference name could not be matched uniquely to stg_players.
    columns:
      - name: bref_player_slug
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
      - name: match_method
        data_tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set: ["unique_name", "name_and_team", "unmatched"]
                quote_values: true
      - name: salary
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1000000000
                row_condition: "salary is not null"
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["bref_player_slug", "bref_team_abbreviation", "season"]
