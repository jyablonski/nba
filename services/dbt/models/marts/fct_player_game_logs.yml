version: 2

models:
  - name: fct_player_game_logs
    description: Fact table of per-player per-game stats with dimension attributes.
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: game_id
        data_tests:
          - not_null
      - name: location
        data_tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set: ["home", "away"]
                quote_values: true
      - name: points
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 200
      - name: is_back_to_back
        data_tests:
          - dbt_expectations.expect_column_values_to_not_be_null
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["player_id", "game_id"]
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
