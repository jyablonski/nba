version: 2

models:
  - name: fct_player_injuries
    description: Current Basketball-Reference injury snapshot with canonical UUID references.
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: team_id
        data_tests:
          - not_null
      - name: player_name_normalized
        data_tests:
          - not_null
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["player_id", "team_id"]
