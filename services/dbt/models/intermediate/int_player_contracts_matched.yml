version: 2

models:
  - name: int_player_contracts_matched
    description: >
      Player-season remaining salaries matched to NBA person_id. unique_name
      when the normalized name is unique on stg_players; name_and_team when
      the name is ambiguous but unique on that NBA team; unmatched otherwise.
      Never fans out many-to-many name collisions.
    columns:
      - name: bref_player_slug
        data_tests:
          - not_null
      - name: match_method
        data_tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set: ["unique_name", "name_and_team", "unmatched"]
                quote_values: true
      - name: salary
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1000000000
                row_condition: "salary is not null"
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["bref_player_slug", "bref_team_abbreviation", "season"]
