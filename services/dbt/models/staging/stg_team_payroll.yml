version: 2

models:
  - name: stg_team_payroll
    description: Team-season payroll totals from Basketball-Reference, resolved to canonical UUIDs.
    columns:
      - name: team_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["team_id", "season"]
