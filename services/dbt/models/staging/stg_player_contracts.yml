version: 2

models:
  - name: stg_player_contracts
    description: Remaining player-season salaries from Basketball-Reference, already resolved to canonical UUIDs.
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: team_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["player_id", "team_id", "season"]
