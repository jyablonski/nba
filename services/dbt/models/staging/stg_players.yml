version: 2

models:
  - name: stg_players
    description: Cleaned player biographical data from the NBA API.
    columns:
      - name: player_id
        description: Unique NBA player identifier.
        data_tests:
          - unique
          - not_null
      - name: full_name
        description: Display name for the player.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_value_lengths_to_be_between:
              arguments:
                min_value: 1
                max_value: 200
      - name: is_active
        data_tests:
          - dbt_expectations.expect_column_values_to_not_be_null
      - name: from_year
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1946
                max_value: 2100
                row_condition: "from_year is not null"
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
