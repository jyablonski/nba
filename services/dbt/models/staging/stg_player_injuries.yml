version: 2

models:
  - name: stg_player_injuries
    description: >
      Current Basketball-Reference injury snapshot, lightly cleaned.
      Grain is player_name_normalized x bref team. Not a historical ledger.
    columns:
      - name: player_name_normalized
        data_tests:
          - not_null
      - name: bref_team_abbreviation
        data_tests:
          - not_null
      - name: nba_team_abbreviation
        data_tests:
          - not_null
          - dbt_expectations.expect_column_value_lengths_to_equal:
              arguments:
                value: 3
      - name: description
        data_tests:
          - not_null
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["player_name_normalized", "bref_team_abbreviation"]
