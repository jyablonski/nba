[project]
name = "nba-scraper"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "nba_api==1.11.4",
    "sqlalchemy==2.0.52",
    "psycopg2-binary==2.9.12",
    "python-dotenv==1.2.3",
    "tenacity==9.1.4",
    "click==8.5.0",
    "pydantic-settings==2.15.0",
    "requests==2.34.2",
    "beautifulsoup4==4.13.5",
    "praw==8.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "testcontainers[postgres]==4.15.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-m",
    "not integration",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=90",
    "--color=yes",
]
markers = [
    "unit: Unit tests that don't require external dependencies",
    "integration: Tests that require Docker / Testcontainers Postgres",
]
