[project]
name = "nba-migrate"
version = "0.1.0"
description = "Alembic migrations for the Postgres source schema"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.16.5",
    "sqlalchemy==2.0.52",
    "psycopg2-binary==2.9.12",
    "python-dotenv==1.2.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "testcontainers[postgres]==4.15.0",
    "ty==0.0.78",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# `../..` is the repo root, for the shared `testing.postgres_tc` helpers.
pythonpath = ["../.."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--color=yes",
]
markers = [
    "unit: Tests that do not require Docker",
    "integration: Tests that require Docker / Testcontainers Postgres",
]

# Anchors ty to this service so it does not walk up and type-check the whole
# repo against this venv. The repo root mirrors pytest's pythonpath, which is
# how the Testcontainers test imports `testing.postgres_tc`.
[tool.ty.environment]
extra-paths = ["migrations", "../.."]
