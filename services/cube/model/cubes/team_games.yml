# One row per team per game (home and away unpivoted from gold.fct_team_game_results).
# Needed for team W/L with opponent / location / arena-city filters. Game-grain cubes cannot express "this team won".
cubes:
  - name: team_games
    sql: |
      SELECT
        game_id || '-' || CAST(home_team_id AS VARCHAR) AS id,
        game_id,
        season,
        season_type,
        game_date,
        arena,
        arena_city,
        home_team_id AS team_id,
        home_team_abbreviation AS team_abbreviation,
        home_team_name AS team_name,
        away_team_abbreviation AS opponent_abbreviation,
        'home' AS location,
        CASE WHEN winning_team_id = home_team_id THEN 'W' ELSE 'L' END AS result
      FROM gold.fct_team_game_results
      UNION ALL
      SELECT
        game_id || '-' || CAST(away_team_id AS VARCHAR) AS id,
        game_id,
        season,
        season_type,
        game_date,
        arena,
        arena_city,
        away_team_id AS team_id,
        away_team_abbreviation AS team_abbreviation,
        away_team_name AS team_name,
        home_team_abbreviation AS opponent_abbreviation,
        'away' AS location,
        CASE WHEN winning_team_id = away_team_id THEN 'W' ELSE 'L' END AS result
      FROM gold.fct_team_game_results

    joins:
      - name: teams
        sql: "{CUBE}.team_id = {teams}.team_id"
        relationship: many_to_one

    dimensions:
      - name: id
        sql: id
        type: string
        primary_key: true

      - name: game_id
        sql: game_id
        type: string

      - name: game_date
        sql: game_date
        type: time

      - name: season
        sql: season
        type: string

      - name: season_type
        sql: season_type
        type: string

      - name: arena
        sql: arena
        type: string

      - name: arena_city
        sql: arena_city
        type: string

      - name: team_id
        sql: team_id
        type: string

      - name: team_abbreviation
        sql: team_abbreviation
        type: string

      - name: team_name
        sql: team_name
        type: string

      - name: opponent_abbreviation
        sql: opponent_abbreviation
        type: string

      - name: location
        sql: location
        type: string

      - name: result
        sql: result
        type: string

    measures:
      - name: games
        sql: game_id
        type: count_distinct

      - name: wins
        sql: game_id
        type: count_distinct
        filters:
          - sql: "{CUBE}.result = 'W'"

      - name: losses
        sql: game_id
        type: count_distinct
        filters:
          - sql: "{CUBE}.result = 'L'"
