cubes:
  - name: player_contracts
    sql_table: gold.fct_player_contracts
    description: Basketball-Reference remaining-year player-season salary keyed by canonical UUIDs.

    dimensions:
      - name: id
        sql: "CAST(player_id AS VARCHAR) || '-' || CAST(team_id AS VARCHAR) || '-' || season"
        type: string
        primary_key: true
        public: true

      - name: player_id
        sql: player_id
        type: string

      - name: player_name
        sql: player_name
        type: string

      - name: match_method
        sql: match_method
        type: string

      - name: team_id
        sql: team_id
        type: string

      - name: team_abbreviation
        sql: team_abbreviation
        type: string

      - name: season
        sql: season
        type: string

      - name: salary
        sql: salary
        type: number

      - name: is_fully_guaranteed
        sql: is_fully_guaranteed
        type: boolean

      - name: remaining_guaranteed
        sql: remaining_guaranteed
        type: number

      - name: player_age
        sql: player_age
        type: number

    measures:
      - name: count
        type: count

      - name: total_salary
        sql: salary
        type: sum
