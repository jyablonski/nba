cubes:
  - name: player_injuries
    sql_table: gold.fct_player_injuries
    description: Current Basketball-Reference injury snapshot keyed by canonical player and team UUIDs.

    dimensions:
      - name: id
        sql: "CAST(player_id AS VARCHAR) || '-' || CAST(team_id AS VARCHAR)"
        type: string
        primary_key: true
        public: true

      - name: player_name
        sql: player_name
        type: string

      - name: player_name_normalized
        sql: player_name_normalized
        type: string

      - name: team_abbreviation
        sql: team_abbreviation
        type: string

      - name: update_date
        sql: update_date
        type: time

      - name: description
        sql: description
        type: string

      - name: source_url
        sql: source_url
        type: string

      - name: team_id
        sql: team_id
        type: string

      - name: player_id
        sql: player_id
        type: string

      - name: match_method
        sql: match_method
        type: string

    measures:
      - name: count
        type: count
