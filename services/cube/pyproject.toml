[project]
name = "nba-cube"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=90",
    "--color=yes",
]
markers = [
    "unit: Unit tests that don't require external dependencies",
]
