repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^docker-compose\.prod\.yml$
      - id: check-toml
      - id: debug-statements
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        types_or: [javascript, jsx, ts, tsx, css, json, markdown, yaml]
        exclude: ^(package-lock\.json|.*uv\.lock|htmlcov/|.*coverage/)
        entry: node services/frontend/node_modules/prettier/bin/prettier.cjs --write
        pass_filenames: true
      # ty runs per service: each has its own venv and its own src on the module
      # path, so a single repo-wide invocation would resolve imports against the
      # wrong environment. --python is explicit because pre-commit exports the
      # root VIRTUAL_ENV, which ty would otherwise use to resolve third-party
      # imports. Production source only; tests use duck-typed doubles.
      - id: ty
        name: ty
        language: system
        pass_filenames: false
        files: ^services/(api|scraper|mcp|cube|ml|migrate)/.*\.py$
        entry: bash -c 'for s in api scraper mcp cube ml migrate; do echo "-- ty $s"; (cd "services/$s" && ./.venv/bin/ty check --python .venv) || exit 1; done'
      - id: frontend-eslint
        name: frontend eslint
        language: system
        pass_filenames: false
        files: ^services/frontend/.*\.(js|jsx|ts|tsx)$
        entry: bash -c 'cd services/frontend && npx eslint --max-warnings=0 .'
      # `next build` type-checks with tsconfig.build.json, which only excludes
      # tests — so a clean tsconfig.json (the superset) guarantees the image
      # build type-checks too. Neither eslint nor vitest runs tsc.
      - id: frontend-tsc
        name: frontend tsc
        language: system
        pass_filenames: false
        files: ^services/frontend/.*\.(ts|tsx)$
        entry: bash -c 'cd services/frontend && npm run --silent typecheck'
